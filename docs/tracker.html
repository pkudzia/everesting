<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pawel's event controls</title>
<style>
  :root {
    --paper: #fbf8ed; --paper-2: #efebe0; --ink: #26282d;
    --dim: #66676a; --line: #d2cec3; --pear: #dce96a;
    --pear-deep: #aeba42; --coral: #e5554f; --mint: #78d69a;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 440px; margin: 0 auto; padding: 20px;
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { margin: 4px 0; font-size: 26px; line-height: 1.15; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; }
  .sub { color: var(--dim); margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px; font: inherit; background: #fff;
  }
  input:focus, button:focus-visible { outline: 3px solid #4d8dd9; outline-offset: 2px; }
  button {
    width: 100%; border: 0; border-radius: 999px; padding: 14px;
    font: inherit; font-weight: 750; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: wait; }
  #finish {
    margin-top: 12px; background: var(--pear); color: var(--ink);
    box-shadow: 0 4px 0 var(--pear-deep); font-size: 18px;
  }
  #start-climb { margin-top: 12px; background: var(--mint); color: var(--ink); display: none; }
  .gain-field { margin-top: 18px; }
  .gain-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .gain-row button { width: auto; padding-inline: 18px; background: var(--ink); color: var(--paper); }
  #finish:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pear-deep); }
  #undo { margin-top: 14px; padding: 8px; background: transparent; color: var(--dim); font-size: 13px; }
  #start { margin-top: 12px; background: var(--ink); color: var(--paper); }
  #stop { margin-top: 12px; background: var(--paper-2); color: var(--ink); display: none; }
  .count { display: flex; align-items: baseline; gap: 9px; margin: 8px 0 2px; }
  .count strong { font-size: 42px; line-height: 1; }
  .count span { color: var(--dim); }
  #status { min-height: 1.5em; margin-top: 12px; font-weight: 650; }
  #status.good { color: #28784a; }
  #status.bad { color: var(--coral); }
  .small { margin-top: 8px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<h1>Event controls</h1>
<p class="sub">Keep this page open for tomorrow.</p>

<div class="card">
  <label for="key">Tracker key or receiver URL</label>
  <input id="key" type="password" autocomplete="off" placeholder="Paste once">
  <p class="small">Saved on this phone.</p>
</div>

<div class="card">
  <h2>At the gondola</h2>
  <div class="count"><strong id="completed">?</strong><span>of 10 finished</span></div>
  <button id="finish" type="button">Finished climb — on gondola</button>
  <button id="start-climb" type="button">Start next climb</button>
  <button id="undo" type="button">Undo last tap</button>
  <div class="gain-field">
    <label for="gain">Total metres climbed</label>
    <div class="gain-row">
      <input id="gain" type="number" min="0" max="20000" step="1" inputmode="numeric" placeholder="e.g. 920">
      <button id="update-gain" type="button">Update</button>
    </div>
  </div>
  <div class="gain-field">
    <label for="distance">Total distance (km)</label>
    <div class="gain-row">
      <input id="distance" type="number" min="0" max="200" step="0.1" inputmode="decimal" placeholder="e.g. 4.3">
      <button id="update-distance" type="button">Update</button>
    </div>
  </div>
</div>

<div class="card">
  <h2>Share live location</h2>
  <p class="small">Use this only if Overland is not already sharing your location.</p>
  <button id="start" type="button">Start sharing location</button>
  <button id="stop" type="button">Stop sharing</button>
</div>

<p id="status" role="status">Ready.</p>

<script>
(() => {
  const API = 'https://everesting-wall.vercel.app/api/ping';
  const PUSH_MS = 60_000;
  const keyInput = document.getElementById('key');
  const completed = document.getElementById('completed');
  const status = document.getElementById('status');
  const start = document.getElementById('start');
  const stop = document.getElementById('stop');
  const finish = document.getElementById('finish');
  const startClimb = document.getElementById('start-climb');
  const gainInput = document.getElementById('gain');
  const updateGain = document.getElementById('update-gain');
  const distanceInput = document.getElementById('distance');
  const updateDistance = document.getElementById('update-distance');
  let watchId = null;
  let pushTimer = null;
  let wakeLock = null;
  let lastFix = null;
  let sentFirstFix = false;

  keyInput.value = localStorage.getItem('everesting_ping_key') || '';

  const say = (message, kind = '') => {
    status.textContent = message;
    status.className = kind;
  };

  const key = () => {
    let value = keyInput.value.trim();
    if (!value) {
      say('Paste the tracker key first.', 'bad');
      return null;
    }
    if (/^https?:\/\//i.test(value)) {
      try {
        value = new URL(value).searchParams.get('key') || '';
      } catch {
        value = '';
      }
      if (!value) {
        say('That receiver URL does not contain a tracker key.', 'bad');
        return null;
      }
      keyInput.value = value;
    }
    localStorage.setItem('everesting_ping_key', value);
    return value;
  };

  async function send(body) {
    const value = key();
    if (!value) throw new Error('missing key');
    const response = await fetch(`${API}?key=${encodeURIComponent(value)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    if (Number.isFinite(data.completed_laps)) completed.textContent = data.completed_laps;
    if (Number.isFinite(data.gained_m)) gainInput.value = data.gained_m;
    if (Number.isFinite(data.distance_km)) distanceInput.value = data.distance_km;
    if (data.state) showState(data.state, data.completed_laps);
    return data;
  }

  function showState(state, count) {
    if (count >= 10) {
      finish.style.display = 'none';
      startClimb.style.display = 'none';
      return;
    }
    const onGondola = state === 'gondola' && count < 10;
    finish.style.display = onGondola ? 'none' : 'block';
    startClimb.style.display = onGondola ? 'block' : 'none';
  }

  async function lapAction(action) {
    const button = action === 'finish_lap' ? finish : action === 'start_climb' ? startClimb : document.getElementById('undo');
    button.disabled = true;
    say('Updating…');
    try {
      const data = await send({ action });
      const message = data.state === 'gondola'
        ? `On the gondola. ${data.completed_laps} of 10 finished.`
        : `Starting climb ${Math.min(10, data.completed_laps + 1)}.`;
      say(message, 'good');
    } catch (error) {
      if (error.message !== 'missing key') say(`Update failed: ${error.message}`, 'bad');
    }
    button.disabled = false;
  }

  document.getElementById('finish').onclick = () => lapAction('finish_lap');
  document.getElementById('start-climb').onclick = () => lapAction('start_climb');
  updateGain.onclick = async () => {
    const gained = Math.round(Number(gainInput.value));
    if (!Number.isFinite(gained) || gained < 0 || gained > 20000) {
      say('Enter total metres between 0 and 20,000.', 'bad');
      return;
    }
    updateGain.disabled = true;
    say('Updating metres…');
    try {
      const data = await send({ action: 'set_gain', gained_m: gained });
      say(`${data.gained_m.toLocaleString()} m climbed.`, 'good');
    } catch (error) {
      if (error.message !== 'missing key') say(`Update failed: ${error.message}`, 'bad');
    }
    updateGain.disabled = false;
  };
  updateDistance.onclick = async () => {
    const distance = Number(distanceInput.value);
    if (!Number.isFinite(distance) || distance < 0 || distance > 200) {
      say('Enter total distance between 0 and 200 km.', 'bad');
      return;
    }
    updateDistance.disabled = true;
    say('Updating distance…');
    try {
      const data = await send({ action: 'set_distance', distance_km: distance });
      say(`${data.distance_km.toFixed(1)} km travelled.`, 'good');
    } catch (error) {
      if (error.message !== 'missing key') say(`Update failed: ${error.message}`, 'bad');
    }
    updateDistance.disabled = false;
  };
  document.getElementById('undo').onclick = () => lapAction('undo_lap');
  keyInput.addEventListener('change', loadCount);
  if (keyInput.value) loadCount();

  async function loadCount() {
    try {
      await send({ action: 'status' });
      say('Ready.', 'good');
    } catch (error) {
      if (error.message !== 'missing key') say(`Could not load progress: ${error.message}`, 'bad');
    }
  }

  start.onclick = async () => {
    if (!key()) return;
    if (!navigator.geolocation) {
      say('This browser cannot share location.', 'bad');
      return;
    }
    watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 30000,
    });
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    pushTimer = setInterval(pushLocation, PUSH_MS);
    start.style.display = 'none';
    stop.style.display = 'block';
    say('Waiting for GPS…');
  };

  stop.onclick = async () => {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    clearInterval(pushTimer);
    if (wakeLock) { try { await wakeLock.release(); } catch {} }
    try { await send({ action: 'offline' }); } catch {}
    start.style.display = 'block';
    stop.style.display = 'none';
    say('Location sharing stopped.');
  };

  function onFix(position) {
    lastFix = {
      lat: position.coords.latitude,
      lon: position.coords.longitude,
      alt: position.coords.altitude,
    };
    if (!sentFirstFix) {
      sentFirstFix = true;
      pushLocation();
    }
  }

  function onGeoError(error) {
    say(`GPS error: ${error.message}`, 'bad');
  }

  async function pushLocation() {
    if (!lastFix) return;
    try {
      await send(lastFix);
      say(`Location sent at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.`, 'good');
    } catch (error) {
      if (error.message !== 'missing key') say(`Location failed: ${error.message}`, 'bad');
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && watchId != null) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
  });
})();
</script>
</body>
</html>
