<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Everesting — phone tracker</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #2a323c;
    --ink: #e8eaed; --dim: #9aa4b2; --accent: #f76707;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px; max-width: 440px; margin-inline: auto;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { color: var(--dim); font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 14px 0 5px; }
  input, textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); border-radius: 10px; padding: 11px 12px; font-size: 15px;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    font: inherit; font-weight: 700; border: none; border-radius: 12px;
    padding: 14px; width: 100%; cursor: pointer; margin-top: 16px;
  }
  #start { background: var(--accent); color: #14181d; }
  #stop { background: #495057; color: #fff; display: none; }
  .lap-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .lap-row button { width: 56px; margin: 0; padding: 10px; font-size: 20px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .lap-row .lap-val { font-family: var(--mono); font-size: 26px; font-weight: 700; min-width: 2ch; text-align: center; }
  #status {
    margin-top: 20px; padding: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    font-family: var(--mono); font-size: 13px; white-space: pre-line; color: var(--dim);
    min-height: 84px;
  }
  #status.live { border-color: #2f9e44; color: var(--ink); }
  .warn { color: #ffa94d; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<h1>Phone tracker</h1>
<p class="sub">Start this at the trailhead and keep the tab open. It pushes your
position to the site about once a minute.</p>

<label for="token">GitHub token (stored on this phone only)</label>
<input id="token" type="password" autocomplete="off"
       placeholder="github_pat_… (contents read/write on pkudzia/everesting)">

<label for="msg">Status message shown on the site (optional)</label>
<textarea id="msg" rows="2" placeholder="e.g. Feeling good, join me for a lap!"></textarea>

<div class="lap-row">
  <button id="lap-minus" type="button" aria-label="Lap down">−</button>
  <span class="lap-val" id="lap-val">1</span>
  <button id="lap-plus" type="button" aria-label="Lap up">+</button>
  <span style="color:var(--dim);font-size:14px;">current lap</span>
</div>

<button id="start" type="button">Start tracking</button>
<button id="stop" type="button">Stop &amp; go offline</button>

<div id="status">Idle.</div>

<p class="warn">Keep the screen on while tracking — phone browsers pause GPS in
locked or background tabs. Plug into a battery pack and drop screen brightness
instead.</p>

<script>
(() => {
  const OWNER = 'pkudzia';
  const REPO = 'everesting';
  const BRANCH = 'live';
  const PATH = 'location.json';
  const PUSH_MS = 60_000;
  // Phone barometer/GPS altitude jitters; only count climbs bigger than this.
  const GAIN_THRESHOLD_M = 3;

  const $ = (id) => document.getElementById(id);
  const tokenInput = $('token');
  const status = $('status');

  tokenInput.value = localStorage.getItem('everesting_token') || '';

  let watchId = null;
  let pushTimer = null;
  let wakeLock = null;
  let lastFix = null;
  let lastAlt = null;
  let gained = 0;
  let lap = 1;
  let sha = null; // content sha of location.json on the live branch
  let pushes = 0;

  const say = (text, live) => {
    status.textContent = text;
    status.classList.toggle('live', !!live);
  };

  $('lap-plus').onclick = () => { lap += 1; $('lap-val').textContent = lap; };
  $('lap-minus').onclick = () => { lap = Math.max(1, lap - 1); $('lap-val').textContent = lap; };

  $('start').onclick = async () => {
    const token = tokenInput.value.trim();
    if (!token) { say('Paste the GitHub token first.'); return; }
    if (!('geolocation' in navigator)) { say('No geolocation on this browser.'); return; }
    localStorage.setItem('everesting_token', token);

    watchId = navigator.geolocation.watchPosition(onFix, onGeoError, {
      enableHighAccuracy: true, maximumAge: 5000, timeout: 30000,
    });

    // Wake lock keeps the screen (and therefore GPS) alive where supported.
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}

    pushTimer = setInterval(push, PUSH_MS);
    $('start').style.display = 'none';
    $('stop').style.display = 'block';
    say('Waiting for first GPS fix…', true);
  };

  $('stop').onclick = async () => {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    clearInterval(pushTimer);
    if (wakeLock) { try { await wakeLock.release(); } catch {} }
    await push(false);
    $('start').style.display = 'block';
    $('stop').style.display = 'none';
    say('Stopped. Site now shows "not live".');
  };

  // Re-acquire the wake lock when the tab comes back to the foreground.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && watchId != null) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
  });

  function onFix(pos) {
    const { latitude, longitude, altitude } = pos.coords;
    lastFix = { lat: latitude, lon: longitude, alt: altitude, at: Date.now() };
    if (altitude != null) {
      if (lastAlt != null) {
        const d = altitude - lastAlt;
        if (Math.abs(d) >= GAIN_THRESHOLD_M) {
          if (d > 0) gained += d;
          lastAlt = altitude;
        }
      } else {
        lastAlt = altitude;
      }
    }
    if (pushes === 0) push();
  }

  function onGeoError(err) {
    say(`GPS error: ${err.message}. Still trying…`, true);
  }

  async function push(active = true) {
    if (!lastFix) return;
    const token = localStorage.getItem('everesting_token');
    const payload = {
      active,
      lat: +lastFix.lat.toFixed(5),
      lon: +lastFix.lon.toFixed(5),
      alt: lastFix.alt == null ? null : Math.round(lastFix.alt),
      gained_m: Math.round(gained),
      lap,
      msg: $('msg').value.trim().slice(0, 140),
      time: new Date().toISOString(),
    };
    const body = {
      message: active ? `live: lap ${lap}` : 'live: offline',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
      branch: BRANCH,
    };
    if (sha) body.sha = sha;

    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
    try {
      if (!sha) {
        const head = await fetch(`${url}?ref=${BRANCH}`, { headers: auth(token) });
        if (head.ok) sha = (await head.json()).sha;
        if (sha) body.sha = sha;
      }
      let res = await fetch(url, { method: 'PUT', headers: auth(token), body: JSON.stringify(body) });
      if (res.status === 409 || res.status === 422) {
        // Someone else moved the file; refetch the sha and retry once.
        const head = await fetch(`${url}?ref=${BRANCH}`, { headers: auth(token) });
        if (head.ok) { sha = (await head.json()).sha; body.sha = sha; }
        res = await fetch(url, { method: 'PUT', headers: auth(token), body: JSON.stringify(body) });
      }
      if (!res.ok) throw new Error(`GitHub ${res.status}`);
      sha = (await res.json()).content.sha;
      pushes += 1;
      say(
        `LIVE — push #${pushes} at ${new Date().toLocaleTimeString()}\n` +
        `lat ${payload.lat}  lon ${payload.lon}\n` +
        `alt ${payload.alt ?? '?'} m   climbed ${payload.gained_m} m   lap ${lap}`,
        active
      );
    } catch (err) {
      say(`Push failed (${err.message}). Will retry next minute.`, active);
    }
  }

  const auth = (token) => ({
    Authorization: `Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json',
  });
})();
</script>
</body>
</html>
